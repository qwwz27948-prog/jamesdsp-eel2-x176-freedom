name: Temporary X176 lint2 transfer and smoke test

on:
  push:
    branches:
      - qwwz27948-prog-patch-1
    paths:
      - 'x176_eel_lint2.txt'
      - '.github/workflows/x176-lint2-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint2-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: qwwz27948-prog-patch-1

      - name: Copy source and run checks
        id: lint
        shell: bash
        run: |
          set -u
          cp x176_eel_lint2.txt x176_eel_lint2.py
          cp_rc=$?
          cmp -s x176_eel_lint2.txt x176_eel_lint2.py
          cmp_rc=$?
          python3 --version > python-version.log 2>&1
          sha256sum x176_eel_lint2.txt x176_eel_lint2.py > source-hashes.txt
          wc -lc x176_eel_lint2.txt x176_eel_lint2.py > source-size.txt

          python3 x176_eel_lint2.py --version > version.log 2>&1
          version_rc=$?
          python3 x176_eel_lint2.py --self-test > selftest.log 2>&1
          selftest_rc=$?
          python3 x176_eel_lint2.py --fail-on invalid check x176_eel_lint2.txt > invalid-option.log 2>&1
          invalid_rc=$?

          {
            echo "Python:"
            cat python-version.log
            echo
            echo "Source sizes:"
            cat source-size.txt
            echo
            echo "SHA-256:"
            cat source-hashes.txt
            echo
            echo "Copy exit code: $cp_rc"
            echo "Byte comparison exit code: $cmp_rc"
            echo "Version command exit code: $version_rc"
            echo "Self-test exit code: $selftest_rc"
            echo "Invalid-option command exit code: $invalid_rc (expected 2)"
            echo
            echo "=== --version output ==="
            cat version.log
            echo
            echo "=== --self-test output ==="
            cat selftest.log
            echo
            echo "=== invalid-option output ==="
            cat invalid-option.log
          } > execution-report.txt
          cat execution-report.txt

          {
            echo "cp_rc=$cp_rc"
            echo "cmp_rc=$cmp_rc"
            echo "version_rc=$version_rc"
            echo "selftest_rc=$selftest_rc"
            echo "invalid_rc=$invalid_rc"
          } >> "$GITHUB_OUTPUT"

      - name: Upload source, Python copy, and full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint2-transfer-artifact
          if-no-files-found: error
          retention-days: 3
          path: |
            x176_eel_lint2.txt
            x176_eel_lint2.py
            python-version.log
            source-hashes.txt
            source-size.txt
            version.log
            selftest.log
            invalid-option.log
            execution-report.txt

      - name: Evaluate smoke-test exit codes
        if: always()
        shell: bash
        env:
          CP_RC: ${{ steps.lint.outputs.cp_rc }}
          CMP_RC: ${{ steps.lint.outputs.cmp_rc }}
          VERSION_RC: ${{ steps.lint.outputs.version_rc }}
          SELFTEST_RC: ${{ steps.lint.outputs.selftest_rc }}
          INVALID_RC: ${{ steps.lint.outputs.invalid_rc }}
        run: |
          test "${CP_RC}" = "0" &&
          test "${CMP_RC}" = "0" &&
          test "${VERSION_RC}" = "0" &&
          test "${SELFTEST_RC}" = "0" &&
          test "${INVALID_RC}" = "2"
